<!-- public/favicon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- background -->
  <circle cx="50" cy="50" r="48" fill="#0b0b0b" />

  <!-- ring -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="#c6a96b" stroke-width="2"/>

  <!-- monogram (simple geometric style instead of font) -->
  <path d="M30 65 L30 35 L40 35 L50 55 L60 35 L70 35 L70 65"
        fill="none"
        stroke="#c6a96b"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- separator dot -->
  <circle cx="50" cy="75" r="2" fill="#c6a96b"/>
</svg>